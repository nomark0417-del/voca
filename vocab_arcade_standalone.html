<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2022 교육부 초·중·고 필수 3,000단어 아케이드 (무배포 단독 실행 & 마지막 시점 이어하기)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #F5F3EB;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    }
    .tap-active:active { transform: scale(0.97); }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Top Dark Header & Live Stats -->
  <header class="bg-[#0F172A] text-white border-b-2 border-slate-900 sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-mono font-extrabold px-2 py-0.5 rounded bg-amber-400 text-slate-950">
            무배포 단독 실행 에디션 · 3,000단어 완비
          </span>
          <span id="save-time-badge" class="text-[11px] font-mono text-emerald-300">
            실시간 자동 저장 활성화
          </span>
        </div>
        <h1 class="text-base sm:text-lg font-extrabold mt-0.5 flex items-center gap-2">
          <span>🎮 2022 교육부 초·중·고 영단어 아케이드</span>
        </h1>
        <p id="point-banner" class="text-xs text-sky-300 font-mono mt-0.5">
          현재 시점: 초등 필수 · 스피드 배틀 · #1 you
        </p>
      </div>

      <!-- Live Dashboard & Sync Controls -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-mono">
          XP: <strong id="xp-val" class="text-amber-400">0</strong> · 
          콤보: <strong id="combo-val" class="text-emerald-400">0</strong> · 
          미출제: <strong id="unseen-val" class="text-sky-300">0</strong>
        </div>
        <button type="button" id="btn-export-save" class="tap-active px-3 py-1.5 rounded-lg bg-amber-400 text-slate-950 text-xs font-extrabold hover:bg-amber-300 transition-colors shadow-sm">
          💾 세이브(.json) 저장
        </button>
        <label class="tap-active px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-extrabold hover:bg-emerald-500 transition-colors cursor-pointer shadow-sm">
          📂 세이브 불러오기
          <input type="file" id="input-save-file" accept=".json" class="hidden" />
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-4">

    <!-- Level & Game Mode Switcher Panel -->
    <section class="bg-white border-2 border-slate-900 rounded-xl p-4 shadow-[4px_4px_0px_#0F172A] space-y-3">
      
      <!-- School Level Switcher -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-200">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-extrabold text-slate-800">🎒 학교급 단계 선택:</span>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <button type="button" id="btn-lv-1" class="tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all">
            🎒 초등 (800)
          </button>
          <button type="button" id="btn-lv-2" class="tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all">
            🏫 중등 (1,200)
          </button>
          <button type="button" id="btn-lv-3" class="tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all">
            🎓 고등 (1,000)
          </button>
          <button type="button" id="btn-lv-all" class="tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all">
            🏆 통합 (3,000)
          </button>
        </div>
      </div>

      <!-- Game Mode Switcher -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-extrabold text-slate-800">🕹️ 게임 모드:</span>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <button type="button" id="btn-mode-blitz" class="tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all">
            ⚡ 1. 스피드 4지선다
          </button>
          <button type="button" id="btn-mode-spelling" class="tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all">
            🔤 2. 스펠링 타자
          </button>
          <button type="button" id="btn-mode-cloze" class="tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all">
            🧩 3. 예문 빈칸 추론
          </button>
        </div>
      </div>
    </section>

    <!-- Main Game Box -->
    <section id="game-card" class="bg-white border-2 border-slate-900 rounded-2xl p-6 shadow-[5px_5px_0px_#0F172A] text-center min-h-[380px] flex flex-col justify-between">
      <div id="game-content">
        <!-- Rendered dynamically -->
      </div>
      <div id="feedback-area" class="mt-4 pt-3 border-t border-slate-100 min-h-[50px] flex items-center justify-center">
        <!-- Feedback messages -->
      </div>
    </section>

    <!-- Zero-Deployment Portable Code Sync Card -->
    <section class="bg-white border-2 border-slate-900 rounded-xl p-4 shadow-[4px_4px_0px_#0F172A] space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-extrabold text-slate-900 flex items-center gap-1">
          📱 카카오톡 1초 진도 복사 / 붙여넣기 (무배포 기기 이동)
        </span>
        <span class="text-[11px] font-mono text-slate-500">배포 서버 불필요</span>
      </div>
      <p class="text-xs text-slate-600">
        아래 <strong>[진도 코드 복사]</strong>를 눌러 카톡으로 보낸 뒤, 다른 PC나 스마트폰에서 붙여넣으면 마지막 문제 시점이 그대로 이어집니다.
      </p>
      <div class="flex items-center gap-2">
        <input type="text" id="sync-code-output" readonly class="flex-1 px-3 py-2 rounded-lg bg-slate-100 border border-slate-300 font-mono text-xs text-slate-700" />
        <button type="button" id="btn-copy-code" class="tap-active px-3.5 py-2 rounded-lg bg-slate-900 text-amber-300 text-xs font-extrabold shrink-0">
          코드 복사
        </button>
      </div>
      <div class="flex items-center gap-2 pt-1 border-t border-slate-200">
        <input type="text" id="sync-code-input" placeholder="다른 기기에서 복사한 진도 코드를 여기에 붙여넣으세요..." class="flex-1 px-3 py-2 rounded-lg bg-[#FAF9F5] border border-slate-300 font-mono text-xs" />
        <button type="button" id="btn-import-code" class="tap-active px-3.5 py-2 rounded-lg bg-emerald-600 text-white text-xs font-extrabold shrink-0 hover:bg-emerald-500">
          진도 복원
        </button>
      </div>
    </section>

  </main>

eat the prisoners.", "그 간수는 죄수들을 때리는 잔인한 야만인이었다."], [2982, 3, "comprehend", "v.", "이해하다, 파악하다", "It was difficult to comprehend the complexity of the algorithm.", "그 알고리즘의 복잡성을 이해하기 어려웠습니다."], [2983, 3, "suffice", "v.", "충분하다", "A simple apology should suffice to resolve the conflict.", "간단한 사과는 분쟁을 해결하기에 충분해야 한다."], [2984, 3, "restrain", "v.", "제지하다, 억제하다, 억누르다", "The police restrained the angry man before he could hit anyone.", "경찰은 화난 남자가 누군가를 때리기 전에 그를 제지했다."], [2985, 3, "intrigue", "n./v.", "흥미를 끌다, 음모, 책략", "The mysterious stranger's story intrigued everyone at the dinner party.", "그 신비로운 낯선 사람의 이야기가 저녁 식사 파티의 모두를 흥 미롭게 했다."], [2986, 3, "gymnasium", "n.", "체육관", "The students played basketball in the school gymnasium.", "학생들은 학교 체육관에서 농구를 했다."], [2987, 3, "veterinarian", "n.", "수의사, 동물 의사", "We took our cat to the veterinarian for a checkup.", "우리는 고양이를 정기검진을 위해 수의사에게 데려갔다."], [2988, 3, "craze", "n.", "유행, 열풍", "The fitness craze swept the nation, with gyms opening on every corner.", "피트니스 열풍이 전국을 휩쓸어 모퉁이마다 체육관이 문을 열 었다."], [2989, 3, "vocation", "n.", "직업, 소명", "T eaching became her vocation after years of professional training.", "교육은 몇 년의 전문적 훈련 후 그녀의 소명이 되었어요."], [2990, 3, "censor", "n./v.", "검열관, 검열하다", "A government censor checked every letter before it was sent.", "정부 검열관은 발송 전에 모든 편지를 검사했다."], [2991, 3, "convene", "v.", "소집하다", "The committee will convene at noon to discuss the proposal.", "위원회는 제안을 논의하기 위해 정오에 소집될 것이다."], [2992, 3, "emit", "v.", "방출하다, 배출하다, (소리를) 내다", "The factory emits toxic gases into the atmosphere every day.", "그 공장은 매일 독성 가스를 대기 중으로 배출한다."], [2993, 3, "incline", "n./v.", "경사면, 비탈, 기울다", "The steep incline made climbing quite difficult.", "가파른 경사면이 등반을 매우 어렵게 만들었다."], [2994, 3, "abound", "v.", "풍부하다, 많이 존재하다", "Fish abound in the ocean, existing in countless numbers.", "물고기는 바다에 풍부하게 존재하며 셀 수 없을 정도로 많다."], [2995, 3, "refrigerate", "v.", "냉장하다, 냉장 보관하다", "You must refrigerate this medicine to keep it safe.", "이 약은 안전하게 보관하려면 냉장해야 해요."], [2996, 3, "posit", "v.", "가정하다, 제시하다", "Some scientists posit that life exists on other planets.", "일부 과학자들은 다른 행성에 생명체가 존재한다고 가정한다."], [2997, 3, "artifice", "n.", "책략, 술수", "He used artifice to gain their trust.", "그는 그들의 신뢰를 얻기 위해 책략을 사용했다."], [2998, 3, "aggress", "v.", "공격하다, 침략하다", "The nation decided not to aggress against neighbors.", "그 국가는 이웃 국가들을 공격하지 않기로 결정했다."], [2999, 3, "evitable", "adj.", "피할 수 있는", "The accident was completely evitable with care.", "사고는 주의를 기울이면 완전히 피할 수 있었습니다."], [3000, 3, "illude", "v.", "속이다, 현혹하다", "He tried to illude the audience.", "그는 청중을 속이려고 했습니다."]];
    const WORDS = RAW_DATA.map(item => ({
      id: item[0],
      stage: item[1],
      word: item[2],
      pos: item[3],
      kor: item[4],
      sentence: item[5],
      translation: item[6]
    }));

    // Player Persistent State
    const defaultState = {
      stages: [1], // 1=초등, 2=중등, 3=고등
      mode: 'blitz',
      lastWordId: 1,
      xp: 0,
      combo: 0,
      maxCombo: 0,
      usedIds: [],
      masteredIds: [],
      wrongIds: [],
      savedAt: new Date().toISOString()
    };

    let state = loadStoredState();
    let currentWord = WORDS.find(w => w.id === state.lastWordId) || WORDS[0];

    
    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      const textEl = document.getElementById('toast-message');
      if (!banner || !textEl) return;
      textEl.textContent = msg;
      banner.style.display = 'flex';
      setTimeout(() => {
        banner.style.display = 'none';
      }, 3000);
    }

    function loadStoredState() {
      try {
        const raw = localStorage.getItem('grade6_vocab_arcade_standalone_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          return { ...defaultState, ...parsed };
        }
      } catch (e) {}
      return { ...defaultState };
    }

    function saveState() {
      state.lastWordId = currentWord.id;
      state.savedAt = new Date().toISOString();
      try {
        localStorage.setItem('grade6_vocab_arcade_standalone_v1', JSON.stringify(state));
      } catch (e) {}
      updateHeader();
    }

    function updateHeader() {
      const pool = WORDS.filter(w => state.stages.includes(w.stage));
      const unseen = pool.filter(w => !state.usedIds.includes(w.id));
      document.getElementById('xp-val').textContent = (state.xp || 0).toLocaleString();
      document.getElementById('combo-val').textContent = state.combo || 0;
      document.getElementById('unseen-val').textContent = unseen.length + ' / ' + pool.length;

      const stageName = state.stages.length === 1 && state.stages[0] === 1 ? '초등 필수(800)'
        : (state.stages.length === 1 && state.stages[0] === 2 ? '중등 필수(1,200)'
        : (state.stages.length === 1 && state.stages[0] === 3 ? '고등 선택(1,000)' : '초·중·고 통합(3,000)'));
      const modeName = state.mode === 'spelling' ? '스펠링 타자' : (state.mode === 'cloze' ? '예문 빈칸 추론' : '스피드 배틀');
      document.getElementById('point-banner').textContent = '현재 시점: ' + stageName + ' · ' + modeName + ' · #' + currentWord.id + ' ' + currentWord.word;

      // Update sync code output (Base64 JSON)
      try {
        document.getElementById('sync-code-output').value = 'G6V-' + btoa(encodeURIComponent(JSON.stringify(state)));
      } catch (e) {}

      // Update level button styling
      const isLv1 = state.stages.length === 1 && state.stages[0] === 1;
      const isLv2 = state.stages.length === 1 && state.stages[0] === 2;
      const isLv3 = state.stages.length === 1 && state.stages[0] === 3;
      const isAll = state.stages.length === 3;

      setBtnStyle('btn-lv-1', isLv1, 'bg-emerald-600 text-white border-emerald-700', 'bg-white text-slate-800 border-slate-300');
      setBtnStyle('btn-lv-2', isLv2, 'bg-sky-600 text-white border-sky-700', 'bg-white text-slate-800 border-slate-300');
      setBtnStyle('btn-lv-3', isLv3, 'bg-amber-500 text-slate-950 border-amber-600', 'bg-white text-slate-800 border-slate-300');
      setBtnStyle('btn-lv-all', isAll, 'bg-purple-600 text-white border-purple-700', 'bg-white text-slate-800 border-slate-300');

      // Update mode button styling
      setBtnStyle('btn-mode-blitz', state.mode === 'blitz', 'bg-[#0F172A] text-amber-300 border-slate-900', 'bg-white text-slate-800 border-slate-300');
      setBtnStyle('btn-mode-spelling', state.mode === 'spelling', 'bg-[#0F172A] text-sky-300 border-slate-900', 'bg-white text-slate-800 border-slate-300');
      setBtnStyle('btn-mode-cloze', state.mode === 'cloze', 'bg-[#0F172A] text-emerald-300 border-slate-900', 'bg-white text-slate-800 border-slate-300');
    }

    function setBtnStyle(id, active, activeCls, inactiveCls) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'tap-active px-3 py-1.5 rounded-lg text-xs font-extrabold border-2 transition-all ' + (active ? activeCls : inactiveCls);
    }

    // Pronunciation engine (MP3 stream + SpeechSynthesis fallback)
    function speak(word) {
      try {
        const audio = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2');
        audio.play().catch(() => {
          speakFallback(word);
        });
      } catch (e) {
        speakFallback(word);
      }
    }

    function speakFallback(word) {
      try {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          setTimeout(() => {
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
          }, 50);
        }
      } catch (e) {}
    }

    // Navigation & Questions
    function setSchoolLevel(stages) {
      state.stages = stages;
      const pool = WORDS.filter(w => state.stages.includes(w.stage));
      const unseen = pool.filter(w => !state.usedIds.includes(w.id));
      currentWord = unseen.length > 0 ? unseen[Math.floor(Math.random() * unseen.length)] : pool[0];
      state.usedIds = Array.from(new Set([...state.usedIds, currentWord.id]));
      saveState();
      renderCurrentQuestion();
      speak(currentWord.word);
    }

    function setGameMode(mode) {
      state.mode = mode;
      saveState();
      renderCurrentQuestion();
    }

    function nextQuestion() {
      const pool = WORDS.filter(w => state.stages.includes(w.stage));
      let unseen = pool.filter(w => !state.usedIds.includes(w.id));
      if (unseen.length === 0) {
        state.usedIds = [];
        unseen = pool;
      }
      currentWord = unseen[Math.floor(Math.random() * unseen.length)] || WORDS[0];
      state.usedIds = Array.from(new Set([...state.usedIds, currentWord.id]));
      saveState();
      renderCurrentQuestion();
      speak(currentWord.word);
    }

    function renderCurrentQuestion() {
      const box = document.getElementById('game-content');
      const fb = document.getElementById('feedback-area');
      fb.innerHTML = '<span class="text-xs text-slate-400">정답을 맞혀 콤보를 이어가세요!</span>';

      const stageBadge = currentWord.stage === 1 ? '초등 필수' : (currentWord.stage === 2 ? '중등 필수' : '고등 선택');
      const badgeColor = currentWord.stage === 1 ? 'bg-emerald-100 text-emerald-800' : (currentWord.stage === 2 ? 'bg-sky-100 text-sky-800' : 'bg-amber-100 text-amber-800');

      if (state.mode === 'spelling') {
        box.innerHTML = `
          <div class="flex items-center justify-center gap-2 mb-2">
            <span class="text-xs font-mono font-bold px-2 py-0.5 rounded ${badgeColor}">${stageBadge} #${currentWord.id}</span>
            <span class="text-xs font-bold text-slate-500">${currentWord.pos}</span>
          </div>
          <div class="text-2xl sm:text-3xl font-extrabold text-slate-900 my-3">${currentWord.kor}</div>
          <button type="button" id="btn-speak-word" class="tap-active inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold mb-4 shadow-sm">
            🔊 원어민 발음 듣기
          </button>
          <div class="max-w-md mx-auto space-y-3">
            <input type="text" id="spelling-input" autofocus autocomplete="off" placeholder="영단어 스펠링을 입력하세요..." class="w-full px-4 py-3 rounded-xl border-2 border-slate-900 font-mono text-center text-xl font-bold tracking-wider bg-[#FAF9F5]" />
            <button type="button" id="btn-submit-spelling" class="tap-active w-full py-3 rounded-xl bg-slate-900 text-amber-300 font-extrabold text-sm hover:bg-slate-800 transition-colors shadow-[2px_2px_0px_#0284C7]">
              스펠링 정답 확인
            </button>
          </div>
        `;
        document.getElementById('btn-speak-word').onclick = () => speak(currentWord.word);
        document.getElementById('btn-submit-spelling').onclick = checkSpelling;
        document.getElementById('spelling-input').onkeydown = (e) => {
          if (e.key === 'Enter') checkSpelling();
        };
      } else {
        const otherWords = WORDS.filter(w => w.id !== currentWord.id).sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [currentWord, ...otherWords].sort(() => Math.random() - 0.5);

        let promptHtml = '';
        if (state.mode === 'cloze') {
          const masked = currentWord.sentence.replace(new RegExp(currentWord.word, 'gi'), ' [ ________ ] ');
          promptHtml = `
            <div class="text-lg sm:text-xl font-extrabold text-slate-900 my-3 leading-relaxed">${masked}</div>
            <div class="text-xs text-slate-500 font-medium mb-3">${currentWord.translation}</div>
          `;
        } else {
          promptHtml = `
            <div class="text-3xl sm:text-4xl font-extrabold font-mono text-slate-900 my-3 tracking-wide">${currentWord.word}</div>
          `;
        }

        box.innerHTML = `
          <div class="flex items-center justify-center gap-2 mb-1">
            <span class="text-xs font-mono font-bold px-2 py-0.5 rounded ${badgeColor}">${stageBadge} #${currentWord.id}</span>
            <span class="text-xs font-bold text-slate-500">${currentWord.pos}</span>
          </div>
          ${promptHtml}
          <button type="button" id="btn-speak-word" class="tap-active inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold mb-4 shadow-sm">
            🔊 원어민 발음 듣기
          </button>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-w-xl mx-auto" id="options-grid"></div>
        `;
        document.getElementById('btn-speak-word').onclick = () => speak(currentWord.word);

        const grid = document.getElementById('options-grid');
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tap-active p-3.5 rounded-xl border-2 border-slate-900 bg-[#FAF9F5] hover:bg-sky-50 font-bold text-sm text-slate-900 text-center transition-all shadow-[2px_2px_0px_#0F172A]';
          btn.textContent = state.mode === 'cloze' ? opt.word + ' (' + opt.kor + ')' : opt.kor;
          btn.onclick = () => checkOption(opt.id);
          grid.appendChild(btn);
        });
      }
    }

    function checkOption(chosenId) {
      const fb = document.getElementById('feedback-area');
      if (chosenId === currentWord.id) {
        state.xp = (state.xp || 0) + 30;
        state.combo = (state.combo || 0) + 1;
        state.maxCombo = Math.max(state.maxCombo || 0, state.combo);
        fb.innerHTML = `
          <div class="flex flex-wrap items-center justify-center gap-3">
            <span class="text-emerald-700 font-extrabold text-sm">⭕ 정답입니다! "${currentWord.sentence}"</span>
            <button type="button" id="btn-next" class="tap-active px-4 py-2 rounded-xl bg-slate-900 text-white font-extrabold text-xs">
              다음 문제 ➔
            </button>
          </div>
        `;
      } else {
        state.combo = 0;
        fb.innerHTML = `
          <div class="flex flex-wrap items-center justify-center gap-3">
            <span class="text-rose-700 font-extrabold text-sm">❌ 정답: [${currentWord.word} : ${currentWord.kor}]</span>
            <button type="button" id="btn-next" class="tap-active px-4 py-2 rounded-xl bg-slate-900 text-white font-extrabold text-xs">
              다음 문제 ➔
            </button>
          </div>
        `;
      }
      saveState();
      document.getElementById('btn-next').onclick = nextQuestion;
    }

    function checkSpelling() {
      const input = document.getElementById('spelling-input');
      if (!input) return;
      const val = input.value.trim().toLowerCase();
      checkOption(val === currentWord.word.toLowerCase() ? currentWord.id : -1);
    }

    // Export & Import Save (.json)
    document.getElementById('btn-export-save').onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '2022교육부_영단어3000_마지막시점_세이브.json';
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('input-save-file').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          state = { ...defaultState, ...parsed };
          currentWord = WORDS.find(w => w.id === state.lastWordId) || WORDS[0];
          saveState();
          renderCurrentQuestion();
          showToast('✅ 저장된 마지막 문제(#' + currentWord.id + ' ' + currentWord.word + ') 시점으로 복원되었습니다!');
        } catch (err) {
          showToast('⚠️ 세이브 파일(.json) 형식이 올바르지 않습니다.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    // Copy & Import Code
    document.getElementById('btn-copy-code').onclick = () => {
      const input = document.getElementById('sync-code-output');
      input.select();
      navigator.clipboard.writeText(input.value);
      showToast('📋 진도 코드가 클립보드에 복사되었습니다! 카톡으로 다른 기기에 붙여넣으세요.');
    };

    document.getElementById('btn-import-code').onclick = () => {
      const input = document.getElementById('sync-code-input');
      const val = input.value.trim().replace(/^G6V-/, '');
      if (!val) return;
      try {
        const parsed = JSON.parse(decodeURIComponent(atob(val)));
        state = { ...defaultState, ...parsed };
        currentWord = WORDS.find(w => w.id === state.lastWordId) || WORDS[0];
        saveState();
        renderCurrentQuestion();
        input.value = '';
        showToast('🎉 다른 기기의 마지막 문제 시점(#' + currentWord.id + ' ' + currentWord.word + ')이 복원되었습니다!');
      } catch (err) {
        showToast('⚠️ 올바른 진도 코드가 아닙니다.');
      }
    };

    // Level buttons wiring
    document.getElementById('btn-lv-1').onclick = () => setSchoolLevel([1]);
    document.getElementById('btn-lv-2').onclick = () => setSchoolLevel([2]);
    document.getElementById('btn-lv-3').onclick = () => setSchoolLevel([3]);
    document.getElementById('btn-lv-all').onclick = () => setSchoolLevel([1, 2, 3]);

    // Mode buttons wiring
    document.getElementById('btn-mode-blitz').onclick = () => setGameMode('blitz');
    document.getElementById('btn-mode-spelling').onclick = () => setGameMode('spelling');
    document.getElementById('btn-mode-cloze').onclick = () => setGameMode('cloze');

    // Initialize
    updateHeader();
    renderCurrentQuestion();
  </script>

  <!-- Toast Notification Box -->
  <div id="toast-banner" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-[#0F172A] text-white px-5 py-3 rounded-2xl border-2 border-amber-400 shadow-2xl font-bold text-xs sm:text-sm hidden items-center gap-2">
    <span id="toast-message">알림</span>
  </div>

</body>
</html>
